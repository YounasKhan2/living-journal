services:
  postgres:
    image: postgres:16-alpine
    container_name: living-journal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: living_journal
      POSTGRES_USER: living_journal
      POSTGRES_PASSWORD: living_journal
    ports:
      - "5433:5432"
    volumes:
      - living_journal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U living_journal -d living_journal"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: living-journal-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - living_journal_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  living_journal_postgres_data:
  living_journal_redis_data:
